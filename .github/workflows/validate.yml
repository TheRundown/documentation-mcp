name: Validate plugin metadata

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool .cursor-plugin/plugin.json > /dev/null
      - run: python3 -m json.tool mcp.json > /dev/null
      - run: python3 -m json.tool glama.json > /dev/null
